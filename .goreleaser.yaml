# .goreleaser.yaml
version: 2
project_name: myapp

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    # The "Golden" rule: Inject version info into your main.go variables
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}} -X main.date={{.Date}}

archives:
  - format: tar.gz
    # Better naming: myapp_Linux_x86_64.tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '(?i)merge' # Hides "Merge branch..." noise
  # use: changelog.md
  # sort: asc
  # filters:
  #   exclude:
  #     - '^docs:'
  #     - '^chore'

# Note: GoReleaser (OSS) usually targets one primary SCM in the 'release' section.
# We will handle the dual-release (GitHub + Codeberg) in the steps below.
release:
  github:
    owner: thevoid12
    name: hanamark