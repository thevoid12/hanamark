
  <title>Blog Posts</title>
  <ul class="blog-post-list">
    {{ range .List }}
    <li class="blog-post-item">
      <a href="{{ .DestPageDir }}" class="blog-post-title">{{ .PageTitle }}</a>
      <span class="blog-post-date">{{ .CreatedDate.Format "2 Jan 2006" }}</span>
    </li>
    {{ end }}
  </ul>
