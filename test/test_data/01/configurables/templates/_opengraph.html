<meta property="og:title" content=`{{ .PageTitle }}`>
<meta property="og:type" content="article">
<meta property="og:url" content="https://example.com/blog/my-post/"> # need to come from backend
<meta property="og:image" content="https://example.com/images/social/my-post.png"> # from config path to the image in static folder
<meta property="og:site_name" content="My Site">
