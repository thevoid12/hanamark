<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ $fav := config "filepath.faviconPath" }}
  {{ if $fav }}
  <link rel="icon" href="{{ findAsset $fav }}">
  {{ end }}
  <title>{{ .PageTitle }}</title>
</head>

<body>
  {{ block "main" . }}{{ end }}
</body>

</html>
