<!DOCTYPE html>

<head>
  {{ template "analytics.html" }}
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .PageTitle }}</title>
</head>

<body>

  <div class="blog-post-container">
    <span class="blog-post-date">Created: {{ .CreatedDate.Format "2 January 2006" }} Updated: {{ .UpdatedDate.Format "2 January 2006" }}</span>
    <div class="blog-post-content">
      {{ .GenHtml }}
    </div>
  </div>

</body>

</html>
