{{ define "main" }}
<h1>This is blog single template!</h1>
<div class="blog-post-container">
  <span class="blog-post-date">Created: {{ .CreatedDate.Format "2006-01-02" }} Updated: {{ .UpdatedDate.Format
    "2006-01-02" }}</span>
  <div class="blog-post-content">
    {{ .GenHtml }}
  </div>
</div>
{{ end }}
